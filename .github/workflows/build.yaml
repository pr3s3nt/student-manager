name: build

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: localhost:5001

jobs:
  build-backend:
    runs-on: [self-hosted, platform-orchestrator]
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        id: build
        run: |
          SHA=$(git log -1 --format='%H')
          docker build -t $REGISTRY/student-manager-backend:$SHA ./backend
          docker push $REGISTRY/student-manager-backend:$SHA
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Trigger backend deploy
        run: |
          gh workflow run deploy.yaml \
            -R pr3s3nt/idp-platform \
            -f app=student-manager-backend \
            -f repo=${{ github.repository }} \
            -f sha=${{ steps.build.outputs.sha }} \
            -f image=student-manager-backend \
            -f env=staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    runs-on: [self-hosted, platform-orchestrator]
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          SHA=$(git log -1 --format='%H')
          docker build -t $REGISTRY/student-manager-frontend:$SHA ./frontend
          docker push $REGISTRY/student-manager-frontend:$SHA

      - name: Trigger frontend deploy
        run: |
          gh workflow run deploy.yaml \
            -R pr3s3nt/idp-platform \
            -f app=student-manager-frontend \
            -f repo=${{ github.repository }} \
            -f sha=${{ needs.build-backend.outputs.sha }} \
            -f image=student-manager-frontend \
            -f env=staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
